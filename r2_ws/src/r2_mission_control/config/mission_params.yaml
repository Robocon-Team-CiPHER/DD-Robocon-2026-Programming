# r2_mission_control/config/mission_params.yaml
# ============================================================
# Mission state machine parameters.
# ============================================================

mission_state_machine_node:
  ros__parameters:
    # Auto-start after all_ready signal (for competition)
    auto_start: true

    # Arena waypoints (metres, in map frame — calibrate for your arena)
    waypoints:
      spearhead_rack:  { x: 1.5, y: 0.5, theta: 0.0 }
      meihua_entry:    { x: 3.0, y: 1.0, theta: 1.57 }
      martial_arena:   { x: 5.0, y: 0.5, theta: 0.0 }

    # Tic Tac Toe rack placement
    ttt_rack:
      row2_height_mm: 1150.0   # 400(platform) + 750(1.5 grids)
      grid_spacing_mm: 500.0
      placement_columns: [0, 1]  # Which columns to place in Row 2

    # Timeouts
    region_timeout_s: 120.0
