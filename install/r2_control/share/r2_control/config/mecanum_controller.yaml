# =====================================
# MECANUM CONTROLLER PARAMETERS
# =====================================

mecanum_controller:
  ros__parameters:

    use_stamped_vel: false

    front_left_wheel_command_joint: front_link_f_wheel_l
    front_right_wheel_command_joint: front_link_f_wheel_r

    rear_left_wheel_command_joint: back_link_b_wheel_l
    rear_right_wheel_command_joint: back_link_b_wheel_r

    front_left_wheel_state_joint: front_link_f_wheel_l
    front_right_wheel_state_joint: front_link_f_wheel_r

    rear_left_wheel_state_joint: back_link_b_wheel_l
    rear_right_wheel_state_joint: back_link_b_wheel_r

    wheel_radius: 0.06

    wheel_separation_width: 0.404
    wheel_separation_length: 0.357

    publish_rate: 50.0

    base_frame_id: base_link
    odom_frame_id: odom

    enable_odom_tf: true

    cmd_vel_timeout: 1.0

    velocity_rolling_window_size: 10

    use_stamped_vel: false
